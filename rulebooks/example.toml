# Example rulebook for the aqh gate. Copy it, rename it, and put your own rules here.
# Keep real names, brands and keys OUT of this public example.
# kinds: which task kinds a rule applies to ("*" = all). Patterns are Python regex.

[paths]
# Paths your readers cannot open (internal servers, home folders). They fail the gate.
banned_prefixes = ["/home/agent", "/srv/internal", "C:\\Users\\agent"]

[secrets]
# Env var names whose VALUES must never appear. Names alone are fine.
env_names = ["OPENAI_API_KEY", "ANTHROPIC_API_KEY", "DEEPSEEK_API_KEY", "OPENROUTER_API_KEY", "PERPLEXITY_API_KEY"]

[dedupe]
# A draft that repeats a topic marked {"type": "posted"} in this JSONL file fails.
kinds = ["article", "post"]
events_file = ""

[[required]]
name = "delivery_label"
kinds = ["article", "report", "web"]
pattern = 'final, ready to go live|\bnot ready\b'
message = 'missing "final, ready to go live" or "not ready" label'

[[required]]
name = "reader_check_line"
kinds = ["article", "report", "web"]
pattern = 'human-reader check:'
message = 'missing "Human-reader check:" line'

[[required]]
name = "unconfirmed_facts_block"
kinds = ["article"]
pattern = '^#{1,3}\s*Unconfirmed facts and first-hand input\s*$'
message = 'missing "## Unconfirmed facts and first-hand input" block'

[[required]]
name = "web_component_line"
kinds = ["web"]
pattern = 'components used:'
message = 'missing "Components used:" line'

[[banned]]
name = "comment_bait"
kinds = ["article", "post", "report"]
pattern = '\bcomment\s+(?:the\s+word|below|this)\b'
message = "comment-bait call to action"

[[banned]]
name = "self_undermining_disclaimer"
kinds = ["article", "post", "report"]
pattern = "\\bto be clear\\b|not anyone'?s|we did not measure|\\blab data\\b|direction,\\s*not"
message = "self-undermining disclaimer"

[[banned]]
name = "placeholder_text"
kinds = ["*"]
pattern = '\[(?:insert|todo|tbd|placeholder)[^\]]*\]|lorem ipsum'
message = "placeholder text left in the deliverable"

[[banned]]
name = "price_on_page"
kinds = ["web"]
pattern = '(?:€|\$)\s?\d[\d.,]*|\b\d[\d.,]*\s*(?:euros?|dollars?|usd|eur)\b'
message = "price on page copy"

[[banned]]
name = "creator_name_in_skill_pack"
kinds = ["*"]
label_contains = "skill.?pack"
pattern = '\b(?:example creator name)\b'
message = "creator or expert name in a public skill pack (list your names here)"
